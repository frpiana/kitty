# Configurazione base di kitty: tutte le impostazioni indipendenti dal tema,
# speculari a ghostty/base.conf del repo starship. I colori arrivano dal repo
# centrale dei temi: in fondo al file c'è l'include del tema attivo, cambiato
# con lo script `theme` (che ricarica kitty al volo via SIGUSR1).

# Caratteri
font_family JetBrainsMono Nerd Font
font_size 14.0

# Legature e stylistic set come su Ghostty. font_features vuole i nomi
# PostScript: se non si applicano, verificarli con `kitty +list-fonts --psnames`
font_features JetBrainsMonoNF-Regular +liga +calt +ss01 +ss02 +ss03
font_features JetBrainsMonoNF-Bold +liga +calt +ss01 +ss02 +ss03
font_features JetBrainsMonoNF-Italic +liga +calt +ss01 +ss02 +ss03
font_features JetBrainsMonoNF-BoldItalic +liga +calt +ss01 +ss02 +ss03

# Simboli box-drawing dal font dei glifi (come font-codepoint-map di Ghostty)
symbol_map U+2500-U+259F Symbols Nerd Font Mono

# Stile del cursore (i colori sono nel tema; blink: default di sistema)
cursor_shape beam
cursor_beam_thickness 2.0

# Padding interno della finestra
window_padding_width 12

# Estetica (opacità/blur dipendono dal compositor, come per Ghostty)
background_opacity 0.95
background_blur 15
inactive_text_alpha 0.85

# Spaziatura migliorata (come adjust-cell-height 8% di Ghostty)
modify_font cell_height 108%

# Clipboard (come clipboard-trim-trailing-spaces di Ghostty)
strip_trailing_spaces smart

# Comportamento
scrollback_lines 25000
enable_audio_bell no
mouse_hide_wait -1.0
shell_integration enabled

# Tab bar (i colori sono nel tema)
tab_bar_style powerline
tab_powerline_style slanted

# macOS (ignorate su Linux, tenute per l'uso di prova sul Mac)
macos_option_as_alt right

# Tema attivo: symlink in active/ gestito dallo script `theme` del repo
# starship. Percorso relativo a questo file (~/.config/kitty), quindi
# risolve in ~/.config/starship/active/kitty.conf. Se il tema non è mai
# stato attivato kitty segnala l'include mancante ma parte comunque:
# basta lanciare `theme <nome>`.
include ../starship/active/kitty.conf
